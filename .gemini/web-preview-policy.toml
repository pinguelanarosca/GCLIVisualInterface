# Web Preview Environment Policy to allow essential development tools in headless execution.
# Baseline low priority (5) so that any user-defined policies take precedence.

[[rule]]
toolName = [
  "replace",
  "run_shell_command",
  "write_file",
  "activate_skill",
  "web_fetch",
  "google_web_search"
]
decision = "allow"
priority = 5
